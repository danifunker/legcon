# The Win32 shell (docs/PLAN.md D13): its own workspace and lockfile, like rusty-backup's.
[package]
name = "legcon-win32"
version = "0.1.0"
description = "legcon, the Win32 front end"
edition = "2021"
license = "AGPL-3.0"
publish = false

[[bin]]
name = "legcon"
path = "src/main.rs"

[dependencies]
legcon = { path = "../.." }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]

[profile.dev]
debug = "line-tables-only"
