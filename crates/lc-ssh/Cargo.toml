[package]
name = "lc-ssh"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SSH-1 and SSH-2 for legcon, pure Rust: shells, exec, SCP and SFTP v3 against old servers"
publish = false

[dependencies]
lc-core = { path = "../lc-core" }
rsa = { version = "0.9", features = ["sha1", "sha2"] }
dsa = "0.6"
rand = "0.8"
base64 = "0.23"
sha2 = { version = "0.10", features = ["oid"] }
sha1 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
subtle = "2"
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
blowfish = "0.9"
cast5 = "0.11"
rc4 = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
des = "0.8"
md5 = { package = "md-5", version = "0.10" }

[dev-dependencies]
tempfile = "3"
