[package]
name = "lc-ssh"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SSH-2 for legcon: shells, exec and SFTP v3 against pre-2005 servers"
publish = false

[dependencies]
lc-core = { path = "../lc-core" }
ssh2 = "0.9"
rsa = "0.9"
dsa = "0.6"
rand = "0.8"
base64 = "0.23"
sha2 = "0.10"
des = "0.8"
md5 = { package = "md-5", version = "0.10" }

[dev-dependencies]
tempfile = "3"
