# legcon's pipeline: the lab (Linux), Windows (checks, tests, the Win32 window driven by its UI
# flows), macOS (the same for the AppKit window), then release builds once all three pass.
name: ci

on:
  push:
    branches: [main, phase-0]
  pull_request:
  workflow_dispatch:

jobs:
  # The lab (lab/README.md): pull the published unix90s image pinned in lab/IMAGE and run legcon's
  # lab tests against it. The image is built and published only by hand (lab-image.yml, D43).
  unix90s:
    name: lab (unix90s)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Pull the pinned lab image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          bash lab/lab.sh pull

      - name: Start the lab
        run: bash lab/lab.sh up

      - uses: dtolnay/rust-toolchain@stable

      - name: Lab tests
        run: cargo test --test lab_unix90s -- --ignored --test-threads=1

      # rsh needs the client's reserved source port, which Docker's published ports rewrite; so the
      # rsh tests also run as root in a container sharing the lab container's network.
      - name: rsh lab tests, inside the lab's network
        run: |
          bin=$(cargo test --test lab_unix90s --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "lab_unix90s") | .executable')
          # The runner's own Ubuntu, so the binary built here finds the C library it was built against.
          runner_ubuntu="ubuntu:$(. /etc/os-release && echo "$VERSION_ID")"
          docker run --rm --network container:legcon-lab-unix90s -v "$bin":/lab_tests:ro \
            -e LEGCON_LAB_HOST=127.0.0.1 -e LEGCON_LAB_NATIVE=1 -e LEGCON_LAB_RSH=1 "$runner_ubuntu" \
            /lab_tests --ignored --test-threads=1 rsh the_machine_says resume

      - name: Server logs on failure
        if: failure()
        run: bash lab/lab.sh logs

      - name: Stop the lab
        if: always()
        run: bash lab/lab.sh down || true

  # Windows: formatting, clippy, the MVC boundaries, every test, and the UI flows driving the real
  # Win32 window through UI Automation (the demo machine and pretend servers; lab flows stay local).
  windows:
    name: windows (checks, tests, UI flows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            frontends/win32 -> target

      - name: Formatting
        shell: bash
        run: cargo fmt --all --check && (cd frontends/win32 && cargo fmt --check)

      - name: Clippy
        shell: bash
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cd frontends/win32 && cargo clippy -- -D warnings

      - name: MVC boundaries
        shell: bash
        run: sh scripts/check-boundaries.sh

      - name: Tests
        run: cargo test --workspace

      - name: Build the Win32 window, lc and the pretend servers the flows start
        shell: bash
        run: |
          cargo build --workspace --bins --examples
          cd frontends/win32 && cargo build

      - name: Python for the UI flows
        run: python -m pip install comtypes tomli Pillow

      - name: UI flows
        env:
          LEGCON_FLOW_SHOTS: ${{ runner.temp }}/flow-failures
        run: python regression-tests/run_flows.py

      - name: Screens of failed flows
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flow-failures
          path: ${{ runner.temp }}/flow-failures
          if-no-files-found: ignore

  # macOS: the AppKit window's formatting and clippy, the MVC boundaries, every test, and the UI
  # flows driving the real window through Accessibility (the demo machine and pretend servers).
  macos:
    name: macos (checks, tests, UI flows)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            frontends/appkit -> target

      - name: Formatting
        run: cargo fmt --all --check && (cd frontends/appkit && cargo fmt --check)

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cd frontends/appkit && cargo clippy -- -D warnings

      - name: MVC boundaries
        run: sh scripts/check-boundaries.sh

      - name: Tests
        run: cargo test --workspace

      # macOS ships a current OpenSSH sshd: key login, strict key exchange, exec, SFTP, a terminal.
      - name: SSH against the system's OpenSSH
        run: cargo test -p lc-ssh --test local_openssh -- --ignored

      - name: Build the AppKit window, lc and the pretend servers the flows start
        run: |
          cargo build --workspace --bins --examples
          frontends/appkit/bundle/build-app.sh --debug

      - name: Python for the UI flows
        run: |
          python3 -m venv regression-tests/.venv
          regression-tests/.venv/bin/pip install pyobjc-framework-ApplicationServices pyobjc-framework-Quartz tomli

      # The flows need the Accessibility permission, which hosted runners grant to the steps'
      # shell; when they do not, the job says so instead of failing on it.
      - name: Accessibility permission
        id: ax
        run: |
          if regression-tests/.venv/bin/python -c "import ApplicationServices as A, sys; sys.exit(0 if A.AXIsProcessTrusted() else 1)"; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Accessibility permission on this runner: the AppKit UI flows were not run."
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: UI flows
        if: steps.ax.outputs.trusted == 'true'
        env:
          LEGCON_FLOW_SHOTS: ${{ runner.temp }}/flow-failures
        run: regression-tests/.venv/bin/python regression-tests/run_flows.py --shell appkit

      - name: Screens of failed flows
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flow-failures-macos
          path: ${{ runner.temp }}/flow-failures
          if-no-files-found: ignore

  # Release builds, once the lab, Windows and macOS pass: the Win32 window and lc for Windows x64,
  # x86 (Windows 10) and ARM64 (Windows 11); the AppKit legcon.app and lc for macOS, universal
  # (macOS 11 and later); lc for Linux. Each is kept as a workflow artifact.
  build:
    name: build (${{ matrix.target }})
    needs: [unix90s, windows, macos]
    strategy:
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
          # 32-bit, for Windows 10 on x86; the x64 runner builds it and runs it.
          - target: windows-x86
            os: windows-latest
            rust_targets: i686-pc-windows-msvc
          # Windows 11 on ARM, built natively.
          - target: windows-arm64
            os: windows-11-arm
            rust_targets: aarch64-pc-windows-msvc
          - target: linux-x64
            os: ubuntu-latest
          - target: macos-universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin, x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          workspaces: |
            . -> target
            frontends/win32 -> target
            frontends/appkit -> target

      # macOS signing, with the secrets vintrdp, rusty-backup and iris use (MACOS_CERTIFICATE,
      # MACOS_CERTIFICATE_PWD, MACOS_TEAM_ID, MACOS_NOTARIZE_*); without them, ad hoc, unnotarized.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::MACOS_CERTIFICATE is not set: legcon.app is signed ad hoc and not notarized."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          ID=$(security find-identity -v -p codesigning "$KEYCHAIN" \
               | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$ID" ]; then
            echo "::error::MACOS_CERTIFICATE imported, but it holds no 'Developer ID Application' identity."
            exit 1
          fi
          echo "identity=$ID" >> "$GITHUB_OUTPUT"

      - name: Write the notarization key
        if: runner.os == 'macOS'
        env:
          MACOS_NOTARIZE_API_KEY: ${{ secrets.MACOS_NOTARIZE_API_KEY }}
        run: |
          if [ -n "$MACOS_NOTARIZE_API_KEY" ]; then
            printf '%s' "$MACOS_NOTARIZE_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          fi

      - name: Release build
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARIZE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARIZE_API_ISSUER }}
          NOTARY_KEY_PATH: ${{ secrets.MACOS_NOTARIZE_API_KEY != '' && format('{0}/notary.p8', runner.temp) || '' }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARIZE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          mkdir -p dist
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-${GITHUB_SHA::8}"
          if [ "$RUNNER_OS" = Windows ]; then
            T="${{ matrix.rust_targets }}"
            cargo build --release --bin lc --target "$T"
            (cd frontends/win32 && cargo build --release --target "$T")
            cp "target/$T/release/lc.exe" "frontends/win32/target/$T/release/legcon.exe" dist/
            # It starts on this runner (x64 Windows runs x86; the ARM runner runs ARM64).
            dist/lc.exe --help > /dev/null
          elif [ "$RUNNER_OS" = macOS ]; then
            # Both architectures, macOS 11 and later; the bundle script signs, notarizes and
            # packages the app.
            export MACOSX_DEPLOYMENT_TARGET=11.0
            cargo build --release --bin lc --target aarch64-apple-darwin
            cargo build --release --bin lc --target x86_64-apple-darwin
            lipo -create -output dist/lc target/aarch64-apple-darwin/release/lc target/x86_64-apple-darwin/release/lc
            if [ -n "$MACOS_SIGN_IDENTITY" ] && [ "$MACOS_SIGN_IDENTITY" != "-" ]; then
              codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" dist/lc
            fi
            frontends/appkit/bundle/build-app.sh --universal --package "$VERSION" "$PWD/dist"
            # The zip and dmg carry the app: an artifact would drop the bundle's executable bit.
            rm -rf dist/legcon.app
          else
            cargo build --release --bin lc
            cp target/release/lc dist/
          fi
          ls -l dist

      - name: Remove the signing keychain and key
        if: always() && runner.os == 'macOS'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          [ -f "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: legcon-${{ matrix.target }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
