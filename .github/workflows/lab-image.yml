# Rebuild the lab container for amd64 and arm64, run legcon's lab tests against each on a native
# runner, and publish both under one new tag in the GitHub Container Registry (Docker pulls the
# one for its machine). Run by hand only (Actions > lab-image > Run workflow), when lab/containers
# changes; then put the printed tag in lab/IMAGE so the pipeline uses it (D43).
name: lab-image

on:
  workflow_dispatch:

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      latest: ${{ steps.t.outputs.latest }}
    steps:
      - id: t
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "tag=ghcr.io/$owner/legcon-lab-unix90s:$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/$owner/legcon-lab-unix90s:latest" >> "$GITHUB_OUTPUT"

  image:
    name: build and test (${{ matrix.arch }})
    needs: tag
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      ARCH_TAG: ${{ needs.tag.outputs.tag }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the lab image
        run: bash lab/lab.sh build

      - name: Start the lab
        run: bash lab/lab.sh up

      - uses: dtolnay/rust-toolchain@stable

      - name: Lab tests
        run: cargo test --test lab_unix90s -- --ignored --test-threads=1

      - name: rsh lab tests, inside the lab's network
        run: |
          bin=$(cargo test --test lab_unix90s --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "lab_unix90s") | .executable')
          runner_ubuntu="ubuntu:$(. /etc/os-release && echo "$VERSION_ID")"
          docker run --rm --network container:legcon-lab-unix90s -v "$bin":/lab_tests:ro \
            -e LEGCON_LAB_HOST=127.0.0.1 -e LEGCON_LAB_NATIVE=1 -e LEGCON_LAB_RSH=1 "$runner_ubuntu" \
            /lab_tests --ignored --test-threads=1 rsh the_machine_says resume

      - name: Server logs on failure
        if: failure()
        run: bash lab/lab.sh logs

      - name: Push this architecture's image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag legcon-lab/unix90s:dev "$ARCH_TAG"
          docker push "$ARCH_TAG"

      - name: Stop the lab
        if: always()
        run: bash lab/lab.sh down || true

  publish:
    name: publish one tag for both
    needs: [tag, image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Combine amd64 and arm64 under one tag
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          LATEST: ${{ needs.tag.outputs.latest }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$TAG" -t "$LATEST" "$TAG-amd64" "$TAG-arm64"
          docker buildx imagetools inspect "$TAG"
          echo "Published $TAG (amd64 and arm64). Put it in lab/IMAGE to use it in the pipeline." >> "$GITHUB_STEP_SUMMARY"
