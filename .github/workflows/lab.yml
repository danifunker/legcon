# The lab (lab/README.md): build the unix90s container, run legcon's lab tests against it, and on
# main publish the image to the GitHub Container Registry so other jobs and machines can pull it.
name: lab

on:
  push:
    branches: [main, phase-0]
  pull_request:
  workflow_dispatch:

jobs:
  unix90s:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "LAB_IMAGE=ghcr.io/$owner/legcon-lab-unix90s:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "LAB_LATEST=ghcr.io/$owner/legcon-lab-unix90s:latest" >> "$GITHUB_ENV"

      - name: Build the lab image
        run: bash lab/lab.sh build

      - name: Start the lab
        run: bash lab/lab.sh up

      - uses: dtolnay/rust-toolchain@stable

      - name: Lab tests
        run: cargo test --test lab_unix90s -- --ignored --test-threads=1

      # rsh needs the client's reserved source port, which Docker's published ports rewrite; so the
      # rsh tests also run as root in a container sharing the lab container's network.
      - name: rsh lab tests, inside the lab's network
        run: |
          bin=$(cargo test --test lab_unix90s --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "lab_unix90s") | .executable')
          docker run --rm --network container:legcon-lab-unix90s -v "$bin":/lab_tests:ro \
            -e LEGCON_LAB_HOST=127.0.0.1 -e LEGCON_LAB_NATIVE=1 -e LEGCON_LAB_RSH=1 ubuntu:24.04 \
            /lab_tests --ignored --test-threads=1 rsh the_machine_says resume

      - name: Server logs on failure
        if: failure()
        run: bash lab/lab.sh logs

      - name: Publish the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$LAB_IMAGE" "$LAB_LATEST"
          docker push "$LAB_IMAGE"
          docker push "$LAB_LATEST"

      - name: Stop the lab
        if: always()
        run: bash lab/lab.sh down || true
