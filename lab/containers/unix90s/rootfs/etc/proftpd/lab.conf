# ProFTPD for the legcon lab, on 2121.
ServerName "legcon lab ProFTPD"
ServerType standalone
DefaultServer on
Port 2121
User nobody
Group nogroup
PassivePorts 30005 30009
MasqueradeAddress 127.0.0.1
AllowOverwrite on
RequireValidShell off
AuthOrder mod_auth_unix.c
PidFile /run/proftpd.pid
ScoreboardFile /run/proftpd.scoreboard
DelayTable none
WtmpLog off
