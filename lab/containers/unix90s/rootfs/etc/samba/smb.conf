# Samba for the legcon lab: SMB1 (NT1) allowed, LM / NTLMv1 logins allowed. Lab only.
[global]
   workgroup = LAB
   netbios name = UNIX90S
   server string = legcon lab
   server min protocol = NT1
   lanman auth = yes
   ntlm auth = yes
   security = user
   map to guest = Bad User
   smb ports = 139 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   log file = /var/log/samba/%m.log
   dos charset = CP437

[lab]
   path = /home/lab
   read only = no
   valid users = lab

[pub]
   path = /srv/ftp/pub
   guest ok = yes
   read only = yes
