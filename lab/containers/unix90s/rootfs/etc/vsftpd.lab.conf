# vsftpd for the legcon lab: anonymous (read only, /srv/ftp) and the lab user (read-write).
listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=YES
anon_root=/srv/ftp
local_enable=YES
write_enable=YES
local_umask=022
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30004
pasv_address=127.0.0.1
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
ftpd_banner=legcon lab vsftpd
