[package]
name = "legcon"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Connect to 1990s machines: file transfer and remote commands over the protocols they speak"
publish = false
default-run = "lc"

[[bin]]
name = "lc"
path = "src/bin/lc.rs"

[dependencies]
lc-core = { path = "crates/lc-core" }
lc-ftp = { path = "crates/lc-ftp" }
lc-nfs = { path = "crates/lc-nfs" }
lc-rcmd = { path = "crates/lc-rcmd" }
lc-smb = { path = "crates/lc-smb" }
lc-ssh = { path = "crates/lc-ssh" }
lc-telnet = { path = "crates/lc-telnet" }
vt100 = "0.16"
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
dirs = "7"
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["crates/*"]
# The Win32 shell is its own workspace with its own lockfile, as in rusty-backup.
exclude = ["frontends/win32"]

[profile.dev]
debug = "line-tables-only"

# Key generation is unbearably slow unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.dsa]
opt-level = 3
