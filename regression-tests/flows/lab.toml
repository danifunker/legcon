# GUI end to end against the lab container (lab/README.md): every file service through the window.
# Run with: lab/lab.sh up, then python regression-tests/run_flows.py --lab lab.toml

[[case]]
id = "flow.lab.ftp-vsftpd"
description = "Connect, download readme.txt, upload a file (lab-vsftpd)"
lab = true
machines = "lab"
local_files = { "up-{run}.txt" = "uploaded by a legcon GUI flow" }
ui = [
  { op = "select_row", id = "machines.list", name = "lab-vsftpd" },
  { op = "activate", id = "machines.open" },
  { op = "activate", id = "conn.files" },
  { op = "expect_row", id = "remote.list", name = "readme.txt", timeout = 60 },
  { op = "select_row", id = "remote.list", name = "readme.txt" },
  { op = "key", id = "remote.list", key = "f6" },
  { op = "expect_row", id = "local.list", name = "readme.txt", timeout = 60 },
  { op = "select_row", id = "local.list", name = "up-{run}.txt" },
  { op = "key", id = "local.list", key = "f6" },
  { op = "expect_row", id = "remote.list", name = "up-{run}.txt", timeout = 60 },
]
expect_files = ["readme.txt"]

