# The connection view against the built-in demo machine (FLOWS.md): no network needed.

[[case]]
id = "flow.conn.connect-and-browse"
description = "Open the demo machine, connect, go into a folder and back up"
machines = [{ id = "sparc", name = "sparc", address = "demo", services = [{ kind = "demo", port = 0 }] }]
ui = [
  { op = "select_row", id = "machines.list", name = "sparc" },
  { op = "activate", id = "machines.open" },
  { op = "expect_row", id = "remote.list", name = ".profile" },
  { op = "select_row", id = "remote.list", name = "src" },
  { op = "key", id = "remote.list", key = "enter" },
  { op = "expect_row", id = "remote.list", name = "Makefile.local" },
  { op = "key", id = "remote.list", key = "backspace" },
  { op = "expect_row", id = "remote.list", name = ".profile" },
  { op = "activate", id = "conn.close_tab" },
  { op = "expect_row", id = "machines.list", name = "sparc" },
]

[[case]]
id = "flow.conn.address-bar"
description = "Type paths into both address bars: Return goes there, Escape puts the folder back"
machines = [{ id = "sparc", name = "sparc", address = "demo", services = [{ kind = "demo", port = 0 }] }]
ui = [
  { op = "select_row", id = "machines.list", name = "sparc" },
  { op = "activate", id = "machines.open" },
  { op = "expect_row", id = "remote.list", name = ".profile" },
  { op = "fill", id = "remote.path", text = "/etc" },
  { op = "key", id = "remote.path", key = "enter" },
  { op = "expect_row", id = "remote.list", name = "motd" },
  { op = "expect_value", id = "remote.path", value = "/etc" },
  { op = "fill", id = "remote.path", text = "/nowhere" },
  { op = "key", id = "remote.path", key = "escape" },
  { op = "expect_value", id = "remote.path", value = "/etc" },
  { op = "key", id = "remote.list", key = "ctrl+l" },
  { op = "type", text = "../export/home/dani/src" },
  { op = "key", key = "enter" },
  { op = "expect_row", id = "remote.list", name = "Makefile.local" },
  { op = "key", id = "local.list", key = "ctrl+n" },
  { op = "wait_dialog" },
  { op = "fill", id = "prompt.text", text = "docs" },
  { op = "activate", id = "prompt.ok" },
  { op = "expect_row", id = "local.list", name = "docs" },
  { op = "fill", id = "local.path", text = "docs" },
  { op = "key", id = "local.path", key = "enter" },
  { op = "expect_row", id = "local.list", name = "docs", present = false },
  { op = "fill", id = "local.path", text = ".." },
  { op = "key", id = "local.path", key = "enter" },
  { op = "expect_row", id = "local.list", name = "docs" },
]

[[case]]
id = "flow.conn.sort-by-column"
description = "Sort a pane by clicking its headers; folders stay first; the order is remembered"
machines = [{ id = "sparc", name = "sparc", address = "demo", services = [{ kind = "demo", port = 0 }] }]
ui = [
  { op = "select_row", id = "machines.list", name = "sparc" },
  { op = "activate", id = "machines.open" },
  { op = "select_row", id = "remote.list", name = "src" },
  { op = "key", id = "remote.list", key = "enter" },
  { op = "expect_order", id = "remote.list", names = ["gcc-2.95.3", "bash-2.05b.tar.gz", "Makefile.local"] },
  { op = "sort", id = "remote.list", column = "Size" },
  { op = "expect_order", id = "remote.list", names = ["gcc-2.95.3", "Makefile.local", "bash-2.05b.tar.gz"] },
  { op = "sort", id = "remote.list", column = "Size" },
  { op = "expect_order", id = "remote.list", names = ["gcc-2.95.3", "bash-2.05b.tar.gz", "Makefile.local"] },
  { op = "sort", id = "remote.list", column = "Name" },
  { op = "sort", id = "remote.list", column = "Name" },
  { op = "expect_order", id = "remote.list", names = ["gcc-2.95.3", "Makefile.local", "bash-2.05b.tar.gz"] },
  { op = "activate", id = "conn.close_tab" },
  { op = "select_row", id = "machines.list", name = "sparc" },
  { op = "activate", id = "machines.open" },
  { op = "select_row", id = "remote.list", name = "src" },
  { op = "key", id = "remote.list", key = "enter" },
  { op = "expect_order", id = "remote.list", names = ["gcc-2.95.3", "Makefile.local", "bash-2.05b.tar.gz"] },
]

[[case]]
id = "flow.conn.drag-into-folders"
description = "Opening the tab connects; rows dropped on a folder row go into it; held, a folder opens"
machines = [{ id = "sparc", name = "sparc", address = "demo", services = [{ kind = "demo", port = 0 }] }]
local_files = { "notes.txt" = "dragged into a held folder" }
ui = [
  { op = "select_row", id = "machines.list", name = "sparc" },
  { op = "activate", id = "machines.open" },
  { op = "expect_row", id = "remote.list", name = ".profile" },
  { op = "key", id = "local.list", key = "ctrl+n" },
  { op = "wait_dialog" },
  { op = "fill", id = "prompt.text", text = "incoming" },
  { op = "activate", id = "prompt.ok" },
  { op = "expect_row", id = "local.list", name = "incoming" },
  { op = "select_row", id = "remote.list", name = ".profile" },
  { op = "drag", from_id = "remote.list", from_row = ".profile", to_id = "local.list", to_row = "incoming" },
  { op = "expect_row", id = "local.list", name = ".profile", present = false },
  { op = "select_row", id = "local.list", name = "notes.txt" },
  { op = "drag", from_id = "local.list", from_row = "notes.txt", to_id = "remote.list", to_row = "src", hold = 2.5 },
  { op = "expect_row", id = "remote.list", name = "notes.txt" },
  { op = "expect_row", id = "remote.list", name = "Makefile.local" },
]
expect_files = ["incoming/.profile"]

[[case]]
id = "flow.conn.copy-to-home"
description = "Copy a remote file to the home folder with F6"
machines = [{ id = "sparc", name = "sparc", address = "demo", services = [{ kind = "demo", port = 0 }] }]
ui = [
  { op = "select_row", id = "machines.list", name = "sparc" },
  { op = "activate", id = "machines.open" },
  { op = "select_row", id = "remote.list", name = ".profile" },
  { op = "key", id = "remote.list", key = "f6" },
  { op = "expect_row", id = "local.list", name = ".profile" },
]
expect_files = [".profile"]

