[[case]]
id = "flow.conn.layout-is-remembered"
description = "Swap the areas: the machine remembers it"
machines = [{ id = "sparc", name = "sparc", address = "demo", services = [{ kind = "demo", port = 0 }] }]
ui = [
  { op = "select_row", id = "machines.list", name = "sparc" },
  { op = "activate", id = "machines.open" },
  { op = "activate", id = "conn.swap" },
]

[case.expect_machines]
"0.layout.swapped" = true

[[case]]
id = "flow.conn.local-places"
description = "Pin a local folder from the Places menu, go home, and come back through the pin"
machines = [{ id = "sparc", name = "sparc", address = "demo", services = [{ kind = "demo", port = 0 }] }]
ui = [
  { op = "select_row", id = "machines.list", name = "sparc" },
  { op = "activate", id = "machines.open" },
  { op = "key", id = "local.list", key = "ctrl+n" },
  { op = "wait_dialog" },
  { op = "fill", id = "prompt.text", text = "retro" },
  { op = "activate", id = "prompt.ok" },
  { op = "select_row", id = "local.list", name = "retro" },
  { op = "key", id = "local.list", key = "enter" },
  { op = "key", id = "local.list", key = "ctrl+n" },
  { op = "wait_dialog" },
  { op = "fill", id = "prompt.text", text = "inside" },
  { op = "activate", id = "prompt.ok" },
  { op = "expect_row", id = "local.list", name = "inside" },
  { op = "activate", id = "local.places" },
  { op = "menu", name = "Pin this folder" },
